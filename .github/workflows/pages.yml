name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, ccr-ddf3a433-a368ax]
  schedule:
    - cron: '*/5 * * * *'   # refresh the aircraft snapshot
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch aircraft snapshot
        run: node scripts/fetch-data.mjs
      - name: Assemble site
        run: cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
